name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci
      # Traduções: ids, estrutura idêntica entre EN/PT/ES, textos vazios/iguais ao inglês,
      # fallback e chaves de React estáveis. Falha o job se algo divergir.
      - run: npm run check:i18n
      - run: npm run typecheck
      - run: npm run lint
      # `npm run build` já roda o check:i18n (prebuild) e o type-check do Next.
      - run: npm run build
